plugins {
    id 'java'
    id 'application'
}

group = 'com.wiredtiger'
version = '0.1.0'

repositories {
    mavenCentral()
}

// Resolve paths from environment or fall back to typical in-repo defaults (one level up)
def wtJarPath = System.getenv('WT_JAVA_JAR') ?: project.rootDir.toPath().resolve('..').resolve('wiredtiger.jar').normalize().toString()
def wtJniLibDir = System.getenv('WT_JNI_LIB_DIR') ?: project.rootDir.toPath().resolve('..').resolve('lang/java/.libs').normalize().toString()
def wtCoreLibDir = System.getenv('WT_NATIVE_LIB_DIR') ?: project.rootDir.toPath().resolve('..').resolve('.libs').normalize().toString()

dependencies {
    implementation files(wtJarPath)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.wiredtiger.jbindingstest.SmokeMain'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'java.library.path', [wtJniLibDir, wtCoreLibDir].join(java.io.File.pathSeparator)
    // Ensure dependent native libraries are resolvable on macOS
    environment 'DYLD_LIBRARY_PATH', [wtJniLibDir, wtCoreLibDir].join(java.io.File.pathSeparator)
}

tasks.withType(JavaExec).configureEach {
    systemProperty 'java.library.path', [wtJniLibDir, wtCoreLibDir].join(java.io.File.pathSeparator)
    // Ensure dependent native libraries are resolvable on macOS
    environment 'DYLD_LIBRARY_PATH', [wtJniLibDir, wtCoreLibDir].join(java.io.File.pathSeparator)
}

tasks.register('printPaths') {
    doLast {
        println "WT_JAVA_JAR: ${wtJarPath}"
        println "WT_JNI_LIB_DIR: ${wtJniLibDir}"
        println "WT_NATIVE_LIB_DIR: ${wtCoreLibDir}"
    }
}

// Validate presence of the WiredTiger Java artifacts before building/running
tasks.register('verifyBindings') {
    doLast {
        def jar = file(wtJarPath)
        if (!jar.exists()) {
            throw new IllegalStateException("wiredtiger.jar not found at ${jar}. Build WiredTiger with --enable-java and set WT_JAVA_JAR if needed.")
        }
        def jniDir = file(wtJniLibDir)
        if (!jniDir.exists()) {
            throw new IllegalStateException("JNI library directory not found at ${jniDir}. Set WT_JNI_LIB_DIR to the directory containing libwiredtiger_java.")
        }
        def jniCandidates = jniDir.listFiles()
        if (jniCandidates == null || jniCandidates.length == 0) {
            throw new IllegalStateException("JNI library directory ${jniDir} appears empty.")
        }

        def coreDir = file(wtCoreLibDir)
        if (!coreDir.exists()) {
            throw new IllegalStateException("Core native library directory not found at ${coreDir}. Set WT_NATIVE_LIB_DIR to the directory containing libwiredtiger.")
        }
        def coreCandidates = coreDir.listFiles()
        if (coreCandidates == null || coreCandidates.length == 0) {
            throw new IllegalStateException("Core native library directory ${coreDir} appears empty.")
        }
    }
}

tasks.named('compileJava').configure { dependsOn 'verifyBindings' }
tasks.named('test').configure { dependsOn 'verifyBindings' }
tasks.named('run').configure { dependsOn 'verifyBindings' }


