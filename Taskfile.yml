version: '3'

vars:
  JAVA_HOME:
    sh: echo "${JAVA_HOME:-$(/usr/libexec/java_home)}"
  WIREDTIGER_ROOT: "{{.PWD}}"
  JAVA_DIR: "{{.WIREDTIGER_ROOT}}/lang/java"
  CRYSTAL_DIR: "{{.WIREDTIGER_ROOT}}/lang/crystal"
  JNI_INCLUDES: "-I{{.JAVA_HOME}}/include -I{{.JAVA_HOME}}/include/darwin"

# =============================================================================
# CORE LIBRARY TASKS
# =============================================================================

tasks:
  # Build WiredTiger core library
  build-core:
    desc: "Build the core WiredTiger C library"
    cmds:
      - ./configure
      - make -j4
    sources:
      - "src/**/*.c"
      - "src/**/*.h"
    generates:
      - ".libs/libwiredtiger.dylib"

# =============================================================================
# JAVA BINDINGS TASKS
# =============================================================================

  # Clean Java bindings
  clean-java:
    desc: "Clean Java bindings build artifacts"
    dir: "{{.JAVA_DIR}}"
    cmds:
      - rm -rf com/ *.h *.class .libs/
      - rm -f "{{.WIREDTIGER_ROOT}}/wiredtiger.jar"

  # Generate JNI headers
  generate-headers:
    desc: "Generate JNI headers from Java classes"
    dir: "{{.JAVA_DIR}}"
    deps: [clean-java]
    cmds:
      - javac -h . -d . src/com/wiredtiger/db/*.java
      - |
        cat > com_wiredtiger_db_WiredTiger.h << 'EOF'
        #include <jni.h>
        #ifndef _Included_com_wiredtiger_db_WiredTiger
        #define _Included_com_wiredtiger_db_WiredTiger
        #ifdef __cplusplus
        extern "C" {
        #endif
        JNIEXPORT jobject JNICALL Java_com_wiredtiger_db_WiredTiger_open
          (JNIEnv *, jclass, jstring, jstring);
        #ifdef __cplusplus
        }
        #endif
        #endif
        EOF
    sources:
      - "src/com/wiredtiger/db/*.java"
    generates:
      - "com_wiredtiger_db_*.h"
      - "com/wiredtiger/db/*.class"

  # Compile JNI library
  compile-jni:
    desc: "Compile JNI library"
    dir: "{{.JAVA_DIR}}"
    deps: [build-core, generate-headers]
    cmds:
      - mkdir -p .libs
      - |
        gcc -shared -fPIC \
          {{.JNI_INCLUDES}} \
          -I../../src/include \
          -I../.. \
          -L../../.libs \
          -lwiredtiger \
          wiredtiger_java.c \
          -o .libs/libwiredtiger_java.dylib
    sources:
      - "wiredtiger_java.c"
      - "../../.libs/libwiredtiger.dylib"
    generates:
      - ".libs/libwiredtiger_java.dylib"

  # Create JAR file
  create-jar:
    desc: "Create wiredtiger.jar with Java classes"
    dir: "{{.JAVA_DIR}}"
    deps: [generate-headers]
    cmds:
      - rm -rf com/
      - javac -target 11 -source 11 -d . src/com/wiredtiger/db/*.java
      - jar cf ../../wiredtiger.jar -C . com/
    sources:
      - "src/com/wiredtiger/db/*.java"
    generates:
      - "../../wiredtiger.jar"

  # Build complete Java bindings
  build-java:
    desc: "Build complete WiredTiger Java bindings"
    deps: [compile-jni, create-jar]
    cmds:
      - echo "WiredTiger Java bindings built successfully!"
      - echo "JAR file at {{.WIREDTIGER_ROOT}}/wiredtiger.jar"
      - echo "JNI library at {{.JAVA_DIR}}/.libs/libwiredtiger_java.dylib"

  # Test Java bindings
  test-java:
    desc: "Test the Java bindings using jbindingstest"
    dir: "{{.WIREDTIGER_ROOT}}/jbindingstest"
    deps: [build-java]
    env:
      DYLD_LIBRARY_PATH: "{{.JAVA_DIR}}/.libs:{{.WIREDTIGER_ROOT}}/.libs"
    cmds:
      - mkdir -p .wt-java-smoke
      - gradle run -Djava.library.path="{{.JAVA_DIR}}/.libs:{{.WIREDTIGER_ROOT}}/.libs"

  # Run JUnit tests for Java
  test-java-junit:
    desc: "Run JUnit tests for Java bindings"
    dir: "{{.WIREDTIGER_ROOT}}/jbindingstest"
    deps: [build-java]
    env:
      DYLD_LIBRARY_PATH: "{{.JAVA_DIR}}/.libs:{{.WIREDTIGER_ROOT}}/.libs"
    cmds:
      - mkdir -p .wt-java-smoke
      - gradle test -Djava.library.path="{{.JAVA_DIR}}/.libs:{{.WIREDTIGER_ROOT}}/.libs"

# =============================================================================
# CRYSTAL BINDINGS TASKS
# =============================================================================

  # Clean Crystal bindings
  clean-crystal:
    desc: "Clean Crystal bindings build artifacts"
    dir: "{{.CRYSTAL_DIR}}"
    cmds:
      - rm -rf build/ lib/ .crystal/
      - rm -f wiredtiger_crystal

  # Build Crystal C extension
  build-crystal-ext:
    desc: "Build Crystal C extension library"
    dir: "{{.CRYSTAL_DIR}}"
    deps: [build-core]
    cmds:
      - mkdir -p build lib
      - |
        gcc -c -fPIC \
          -I../../src/include \
          -o build/libwiredtiger_crystal.o \
          wiredtiger_crystal.c
      - |
        gcc -shared \
          -o lib/libwiredtiger_crystal.dylib \
          build/libwiredtiger_crystal.o \
          -L../../.libs \
          -lwiredtiger
    sources:
      - "wiredtiger_crystal.c"
      - "../../.libs/libwiredtiger.dylib"
    generates:
      - "lib/libwiredtiger_crystal.dylib"

  # Build Crystal library
  build-crystal-lib:
    desc: "Build Crystal library"
    dir: "{{.CRYSTAL_DIR}}"
    deps: [build-crystal-ext]
    cmds:
      - crystal build --release -o build/wiredtiger_crystal src/wiredtiger.cr
    sources:
      - "src/**/*.cr"
      - "lib/libwiredtiger_crystal.dylib"
    generates:
      - "build/wiredtiger_crystal"

  # Build complete Crystal bindings
  build-crystal:
    desc: "Build complete WiredTiger Crystal bindings"
    deps: [build-crystal-lib]
    cmds:
      - echo "WiredTiger Crystal bindings built successfully!"
      - echo "C extension at {{.CRYSTAL_DIR}}/lib/libwiredtiger_crystal.dylib"
      - echo "Crystal library at {{.CRYSTAL_DIR}}/build/wiredtiger_crystal"

  # Test Crystal bindings
  test-crystal:
    desc: "Test the Crystal bindings"
    dir: "{{.CRYSTAL_DIR}}"
    deps: [build-crystal]
    env:
      DYLD_LIBRARY_PATH: "{{.CRYSTAL_DIR}}/lib:{{.WIREDTIGER_ROOT}}/.libs"
    cmds:
      - crystal spec --link-flags="-L{{.CRYSTAL_DIR}}/lib"

  # Quick test Crystal bindings (assumes already built)
  test-crystal-quick:
    desc: "Quick test of Crystal bindings (assumes already built)"
    dir: "{{.CRYSTAL_DIR}}"
    env:
      DYLD_LIBRARY_PATH: "{{.CRYSTAL_DIR}}/lib:{{.WIREDTIGER_ROOT}}/.libs"
    cmds:
      - crystal spec --link-flags="-L{{.CRYSTAL_DIR}}/lib"

  # Test Crystal bindings with verbose output
  test-crystal-verbose:
    desc: "Test Crystal bindings with verbose output"
    dir: "{{.CRYSTAL_DIR}}"
    deps: [build-crystal]
    env:
      DYLD_LIBRARY_PATH: "{{.CRYSTAL_DIR}}/lib:{{.WIREDTIGER_ROOT}}/.libs"
    cmds:
      - crystal spec --verbose --link-flags="-L{{.CRYSTAL_DIR}}/lib"

  # Test Crystal bindings with custom test directory
  test-crystal-custom-dir:
    desc: "Test Crystal bindings with custom test directory"
    dir: "{{.CRYSTAL_DIR}}"
    deps: [build-crystal]
    env:
      DYLD_LIBRARY_PATH: "{{.CRYSTAL_DIR}}/lib:{{.WIREDTIGER_ROOT}}/.libs"
      WIREDTIGER_TEST_DIR: "{{.CRYSTAL_DIR}}/testdb"
    cmds:
      - mkdir -p testdb
      - crystal spec --link-flags="-L{{.CRYSTAL_DIR}}/lib"
      - rm -rf testdb

  # Build Crystal bindings with Address Sanitizer for memory safety
  build-crystal-asan:
    desc: "Build Crystal C extension with Address Sanitizer for memory safety checking"
    dir: "{{.CRYSTAL_DIR}}"
    deps: [build-core]
    cmds:
      - mkdir -p build lib
      - |
        gcc -c -fPIC -fsanitize=address -g -O0 \
          -I../../src/include \
          -o build/libwiredtiger_crystal.o \
          wiredtiger_crystal.c
      - |
        gcc -shared -fsanitize=address \
          -o lib/libwiredtiger_crystal.dylib \
          build/libwiredtiger_crystal.o \
          -L../../.libs \
          -lwiredtiger
    sources:
      - "wiredtiger_crystal.c"
      - "../../.libs/libwiredtiger.dylib"
    generates:
      - "lib/libwiredtiger_crystal.dylib"

  # Test Crystal bindings with Address Sanitizer
  test-crystal-asan:
    desc: "Test Crystal bindings with Address Sanitizer for memory safety"
    dir: "{{.CRYSTAL_DIR}}"
    deps: [build-crystal-asan]
    env:
      DYLD_LIBRARY_PATH: "{{.CRYSTAL_DIR}}/lib:{{.WIREDTIGER_ROOT}}/.libs"
      ASAN_OPTIONS: "abort_on_error=1:print_stats=1"
    cmds:
      - echo "🧪 Running Crystal bindings with Address Sanitizer..."
      - crystal spec --link-flags="-L{{.CRYSTAL_DIR}}/lib -fsanitize=address"

  # Test Crystal bindings with Address Sanitizer (quick, assumes built)
  test-crystal-asan-quick:
    desc: "Quick test Crystal bindings with Address Sanitizer (assumes already built with ASan)"
    dir: "{{.CRYSTAL_DIR}}"
    env:
      DYLD_LIBRARY_PATH: "{{.CRYSTAL_DIR}}/lib:{{.WIREDTIGER_ROOT}}/.libs"
      ASAN_OPTIONS: "abort_on_error=1:print_stats=1"
    cmds:
      - echo "🧪 Running Crystal bindings with Address Sanitizer (quick mode)..."
      - crystal spec --link-flags="-L{{.CRYSTAL_DIR}}/lib -fsanitize=address"

  # Run specific Crystal test with Address Sanitizer
  test-crystal-asan-specific:
    desc: "Run specific Crystal test file with Address Sanitizer"
    dir: "{{.CRYSTAL_DIR}}"
    deps: [build-crystal-asan]
    env:
      DYLD_LIBRARY_PATH: "{{.CRYSTAL_DIR}}/lib:{{.WIREDTIGER_ROOT}}/.libs"
      ASAN_OPTIONS: "abort_on_error=1:print_stats=1"
    cmds:
      - echo "🧪 Running {{.CLI_ARGS}} with Address Sanitizer..."
      - crystal spec --link-flags="-L{{.CRYSTAL_DIR}}/lib -fsanitize=address" {{.CLI_ARGS}}

    # Memory safety stress test with Address Sanitizer
  test-crystal-asan-stress:
    desc: "Run memory safety stress test with Address Sanitizer"
    dir: "{{.CRYSTAL_DIR}}"
    deps: [build-crystal-asan]
    env:
      DYLD_LIBRARY_PATH: "{{.CRYSTAL_DIR}}/lib:{{.WIREDTIGER_ROOT}}/.libs"
      ASAN_OPTIONS: "abort_on_error=1:print_stats=1"
    cmds:
      - echo "🧪 Running memory safety stress test..."
      - crystal run --link-flags="-L{{.CRYSTAL_DIR}}/lib -fsanitize=address" memory_stress_test.cr

# =============================================================================
# COMBINED TASKS
# =============================================================================

  # Build everything (Java + Crystal)
  build-all:
    desc: "Build complete WiredTiger bindings (Java and Crystal)"
    deps: [build-java, build-crystal]
    cmds:
      - echo "WiredTiger bindings built successfully!"
      - echo "Java JAR file at {{.WIREDTIGER_ROOT}}/wiredtiger.jar"
      - echo "Java JNI library at {{.JAVA_DIR}}/.libs/libwiredtiger_java.dylib"
      - echo "Crystal extension at {{.CRYSTAL_DIR}}/lib/libwiredtiger_crystal.dylib"
      - echo "Crystal library at {{.CRYSTAL_DIR}}/build/wiredtiger_crystal"

  # Test everything
  test-all:
    desc: "Test all bindings (Java and Crystal)"
    deps: [test-java, test-crystal]
    cmds:
      - echo "All tests completed successfully!"

  # Test everything with verbose output
  test-all-verbose:
    desc: "Test all bindings with verbose output"
    deps: [test-java, test-crystal-verbose]
    cmds:
      - echo "All tests completed successfully with verbose output!"

  # Test everything with verbose output (no build dependencies)
  test-all-verbose-quick:
    desc: "Test all bindings with verbose output (assumes already built)"
    deps: [test-java, test-crystal-verbose]
    cmds:
      - echo "All tests completed successfully with verbose output!"

  # Test Crystal bindings with memory safety checking
  test-crystal-memory-safety:
    desc: "Test Crystal bindings with comprehensive memory safety checking"
    deps: [test-crystal-asan, test-crystal-asan-stress]
    cmds:
      - echo "🧪 Memory safety tests completed successfully!"
      - echo "No memory access violations detected by Address Sanitizer!"

  # Quick memory safety test (assumes already built with ASan)
  test-crystal-memory-safety-quick:
    desc: "Quick memory safety test (assumes already built with Address Sanitizer)"
    deps: [test-crystal-asan-quick, test-crystal-asan-stress]
    cmds:
      - echo "🧪 Quick memory safety tests completed successfully!"
      - echo "No memory access violations detected by Address Sanitizer!"

# =============================================================================
# UTILITY TASKS
# =============================================================================

  # Show library information
  info:
    desc: "Show information about built libraries"
    cmds:
      - echo "=== WiredTiger Core Library ==="
      - ls -la .libs/libwiredtiger.dylib 2>/dev/null || echo "Core library not built"
      - echo ""
      - echo "=== Java JNI Library ==="
      - ls -la {{.JAVA_DIR}}/.libs/libwiredtiger_java.dylib 2>/dev/null || echo "JNI library not built"
      - echo ""
      - echo "=== Java JAR ==="
      - ls -la wiredtiger.jar 2>/dev/null || echo "JAR not built"
      - echo ""
      - echo "=== Crystal Extension Library ==="
      - ls -la {{.CRYSTAL_DIR}}/lib/libwiredtiger_crystal.dylib 2>/dev/null || echo "Crystal extension not built"
      - echo ""
      - echo "=== Crystal Library ==="
      - ls -la {{.CRYSTAL_DIR}}/build/wiredtiger_crystal 2>/dev/null || echo "Crystal library not built"

  # Clean everything
  clean:
    desc: "Clean all build artifacts"
    cmds:
      - make clean || true
      - task: clean-java
      - task: clean-crystal
      - rm -rf .libs/ build/ .wt-java-smoke/
      - rm -f wiredtiger.jar

  # Setup development environment
  setup:
    desc: "Setup development environment and check dependencies"
    cmds:
      - echo "=== Checking Dependencies ==="
      - echo "Java Home {{.JAVA_HOME}}"
      - java -version
      - javac -version
      - gcc --version | head -1
      - crystal --version || echo "Crystal not installed"
      - echo ""
      - echo "=== WiredTiger Configuration ==="
      - echo "Root {{.WIREDTIGER_ROOT}}"
      - echo "Java Dir {{.JAVA_DIR}}"
      - echo "Crystal Dir {{.CRYSTAL_DIR}}"
      - echo ""
      - echo "Environment ready for WiredTiger bindings development"

  # Development: quick rebuild and test
  dev:
    desc: "Quick development cycle: rebuild and test"
    deps: [build-all, test-all]

  # Cleanup and maintenance
  clean-crystal:
    desc: "Clean Crystal bindings build artifacts and temporary files"
    dir: "{{.CRYSTAL_DIR}}"
    cmds:
      - echo "🧹 Cleaning Crystal bindings..."
      - ./clean.sh
      - echo "✅ Crystal bindings cleaned successfully!"

  clean-repo:
    desc: "Clean entire repository build artifacts and temporary files"
    cmds:
      - echo "🧹 Cleaning entire repository..."
      - ./clean-repo.sh
      - echo "✅ Repository cleaned successfully!"

  clean-all:
    desc: "Clean all build artifacts and temporary files (alias for clean-repo)"
    cmds:
      - task: clean-repo

  # Package for distribution
  package:
    desc: "Package bindings for distribution (Java and Crystal)"
    deps: [build-all]
    cmds:
      - mkdir -p dist/lib dist/include dist/crystal
      - cp wiredtiger.jar dist/
      - cp {{.JAVA_DIR}}/.libs/libwiredtiger_java.dylib dist/lib/
      - cp .libs/libwiredtiger.dylib dist/lib/
      - cp {{.JAVA_DIR}}/com_wiredtiger_db_*.h dist/include/
      - cp {{.CRYSTAL_DIR}}/lib/libwiredtiger_crystal.dylib dist/lib/
      - cp -r {{.CRYSTAL_DIR}}/src dist/crystal/
      - cp {{.CRYSTAL_DIR}}/shard.yml dist/crystal/
      - cp {{.CRYSTAL_DIR}}/docs/README.md dist/crystal/
      - echo "Distribution package created in dist/"
      - ls -la dist/

# =============================================================================
# ALIASES FOR COMMON TASKS
# =============================================================================

  # Legacy aliases for backward compatibility
  test: test-java
  test-junit: test-java-junit

  # Crystal test aliases
  crystal-test: test-crystal
  crystal-test-quick: test-crystal-quick
  crystal-test-verbose: test-crystal-verbose

  # Memory safety aliases
  asan:
    desc: "Alias for test-crystal-asan"
    cmds:
      - task: test-crystal-asan
  asan-quick:
    desc: "Alias for test-crystal-asan-quick"
    cmds:
      - task: test-crystal-asan-quick
  asan-stress:
    desc: "Alias for test-crystal-asan-stress"
    cmds:
      - task: test-crystal-asan-stress
  memory-safety:
    desc: "Alias for test-crystal-memory-safety"
    cmds:
      - task: test-crystal-memory-safety
  memory-safety-quick:
    desc: "Alias for test-crystal-memory-safety-quick"
    cmds:
      - task: test-crystal-memory-safety-quick

  # Documentation
  help:
    desc: "Show available tasks and their descriptions"
    cmds:
      - echo "=== WiredTiger Bindings Taskfile ==="
      - echo ""
      - echo "=== Core Tasks ==="
      - echo "  build-core     - Build the core WiredTiger C library"
      - echo ""
      - echo "=== Java Bindings ==="
      - echo "  build-java     - Build complete Java bindings"
      - echo "  test-java      - Test Java bindings"
      - echo "  test-java-junit - Run JUnit tests for Java"
      - echo ""
      - echo "=== Crystal Bindings ==="
      - echo "  build-crystal  - Build complete Crystal bindings"
      - echo "  test-crystal   - Test Crystal bindings"
      - echo "  test-crystal-quick - Quick test (assumes built)"
      - echo "  test-crystal-verbose - Test with verbose output (assumes built)"
      - echo "  test-crystal-custom-dir - Test with custom test directory"
      - echo ""
      - echo "=== Memory Safety Testing ==="
      - echo "  build-crystal-asan - Build Crystal bindings with Address Sanitizer"
      - echo "  test-crystal-asan - Test Crystal bindings with Address Sanitizer"
      - echo "  test-crystal-asan-quick - Quick ASan test (assumes built)"
      - echo "  test-crystal-asan-specific - Test specific file with ASan"
      - echo "  test-crystal-asan-stress - Run memory safety stress test"
      - echo "  test-crystal-memory-safety - Comprehensive memory safety testing"
      - echo "  test-crystal-memory-safety-quick - Quick memory safety test"
      - echo ""
      - echo "=== Cleanup and Maintenance ==="
      - echo "  clean-crystal  - Clean Crystal bindings build artifacts"
      - echo "  clean-repo     - Clean entire repository build artifacts"
      - echo "  clean-all      - Clean all build artifacts (alias for clean-repo)"
      - echo ""
      - echo "=== Combined Tasks ==="
      - echo "  build-all      - Build all bindings"
      - echo "  test-all       - Test all bindings"
      - echo "  test-all-verbose - Test all with verbose output"
      - echo "  test-all-verbose-quick - Test all with verbose output (assumes built)"
      - echo ""
      - echo "=== Utility Tasks ==="
      - echo "  setup          - Setup development environment"
      - echo "  info           - Show library information"
      - echo "  clean          - Clean all build artifacts"
      - echo "  help           - Show this help message"