name: wiredtiger-example
version: 0.1.0

description: |
  Example project demonstrating how to use WiredTiger Crystal bindings.
  This shows how to integrate the bindings into your own Crystal project.

authors:
  - Example Developer <dev@example.com>

dependencies:
